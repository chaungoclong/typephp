<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1628" />
      <stop offset="100%" stop-color="#051118" />
    </linearGradient>
  </defs>

  <!-- Angular chamfered octagonal badge -->
  <polygon points="36,8 220,8 248,36 248,220 220,248 36,248 8,220 8,36"
           fill="url(#bgGrad)" stroke="#2DD4BF" stroke-opacity="0.55" stroke-width="4" />

  <!-- Inner angular accent corner lines -->
  <polyline points="22,52 22,22 52,22" fill="none" stroke="#6EE7B7" stroke-opacity="0.4" stroke-width="2" />
  <polyline points="204,234 234,234 234,204" fill="none" stroke="#6EE7B7" stroke-opacity="0.4" stroke-width="2" />

  <!-- Angular Tail (left of T) -->
  <polygon points="32,82 46,68 46,112 32,126" fill="#6EE7B7" />

  <!-- Angular Letter T (Elephant Back + Front Pillar Leg) -->
  <polygon points="52,64 134,64 134,90 104,90 104,192 74,192 74,90 52,90"
           fill="url(#mintGrad)" />

  <!-- Angular Letter P (Elephant Head + Ear Cutout) -->
  <path d="M 122,64
           L 186,64
           L 204,82
           L 204,132
           L 186,150
           L 150,150
           L 150,192
           L 122,192 Z
           M 150,88
           L 150,126
           L 174,126
           L 180,120
           L 180,94
           L 174,88 Z"
        fill="url(#mintGrad)" fill-rule="evenodd" />

  <!-- Angular Raised Elephant Trunk (90/45-degree geometric segments) -->
  <polygon points="198,118 224,118 232,110 232,72 218,58 204,58 204,76 214,76 214,102 198,102"
           fill="#6EE7B7" />

  <!-- Angular Tusk -->
  <polygon points="186,144 206,154 196,162 178,150" fill="#A7F3D0" />

  <!-- Diamond Elephant Eye -->
  <polygon points="165,98 171,92 177,98 171,104" fill="#07111E" />
</svg>
