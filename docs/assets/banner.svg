<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06101D" />
      <stop offset="55%" stop-color="#0A1B2E" />
      <stop offset="100%" stop-color="#072626" />
    </linearGradient>
    <linearGradient id="mint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="glow" cx="22%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2DD4BF" stroke-opacity="0.08" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Angular chamfered outer frame -->
  <polygon points="24,0 1176,0 1200,24 1200,336 1176,360 24,360 0,336 0,24" fill="url(#bannerBg)" />
  <polygon points="24,0 1176,0 1200,24 1200,336 1176,360 24,360 0,336 0,24" fill="url(#grid)" />
  <polygon points="24,0 1176,0 1200,24 1200,336 1176,360 24,360 0,336 0,24" fill="url(#glow)" />
  <polygon points="26,2 1174,2 1198,26 1198,334 1174,358 26,358 2,334 2,26"
           fill="none" stroke="#2DD4BF" stroke-opacity="0.35" stroke-width="2" />

  <!-- Angular geometric accent bars on top-right -->
  <polygon points="960,24 1160,24 1144,34 944,34" fill="#2DD4BF" fill-opacity="0.35" />
  <polygon points="1020,42 1160,42 1148,50 1008,50" fill="#6EE7B7" fill-opacity="0.25" />

  <!-- Angular Mint Elephant TP Emblem on the Left -->
  <g transform="translate(88, 52)">
    <polygon points="36,8 220,8 248,36 248,220 220,248 36,248 8,220 8,36"
             fill="#07111E" stroke="#2DD4BF" stroke-opacity="0.55" stroke-width="4" />
    <polygon points="32,82 46,68 46,112 32,126" fill="#6EE7B7" />
    <polygon points="52,64 134,64 134,90 104,90 104,192 74,192 74,90 52,90" fill="url(#mint)" />
    <path d="M 122,64 L 186,64 L 204,82 L 204,132 L 186,150 L 150,150 L 150,192 L 122,192 Z M 150,88 L 150,126 L 174,126 L 180,120 L 180,94 L 174,88 Z"
          fill="url(#mint)" fill-rule="evenodd" />
    <polygon points="198,118 224,118 232,110 232,72 218,58 204,58 204,76 214,76 214,102 198,102" fill="#6EE7B7" />
    <polygon points="186,144 206,154 196,162 178,150" fill="#A7F3D0" />
    <polygon points="165,98 171,92 177,98 171,104" fill="#07111E" />
  </g>

  <!-- Typography -->
  <text x="400" y="162" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="84" font-weight="800" fill="#F8FAFC" letter-spacing="-2">
    Type<tspan fill="url(#mint)">PHP</tspan>
  </text>

  <text x="404" y="216" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#94A3B8">
    Statically Typed PHP  •  Rust Compiler  •  PHPStan Level 9
  </text>

  <!-- Angular Chamfered Feature Tags -->
  <g transform="translate(404, 248)">
    <polygon points="10,0 138,0 148,10 148,26 138,36 10,36 0,26 0,10" fill="#2DD4BF" fill-opacity="0.14" stroke="#2DD4BF" stroke-opacity="0.5" />
    <text x="74" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#5EEAD4">PHP 8.1 – 8.4</text>

    <polygon points="174,0 278,0 288,10 288,26 278,36 174,36 164,26 164,10" fill="#2DD4BF" fill-opacity="0.14" stroke="#2DD4BF" stroke-opacity="0.5" />
    <text x="226" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#5EEAD4">Generics</text>

    <polygon points="314,0 448,0 458,10 458,26 448,36 314,36 304,26 304,10" fill="#2DD4BF" fill-opacity="0.14" stroke="#2DD4BF" stroke-opacity="0.5" />
    <text x="381" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#5EEAD4">PSR-7 &amp; PSR-12</text>

    <polygon points="484,0 618,0 628,10 628,26 618,36 484,36 474,26 474,10" fill="#2DD4BF" fill-opacity="0.14" stroke="#2DD4BF" stroke-opacity="0.5" />
    <text x="551" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#5EEAD4">Bundle &amp; Minify</text>
  </g>
</svg>
