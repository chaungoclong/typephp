services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    volumes:
      - .:/workspace
      - typephp_target:/workspace/target
    ports:
      - "${TPHP_PORT_8080:-18080}:8080"
      - "${TPHP_PORT_8081:-18081}:8081"
      - "${TPHP_PORT_8082:-18082}:8082"
    stdin_open: true
    tty: true

volumes:
  typephp_target:
